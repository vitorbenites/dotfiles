set-option -g default-command bash
set-option -ga terminal-overrides ",alacritty:Tc"
set -g default-terminal "alacritty"
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g status-position top
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-window-option -g mode-keys vi
set-window-option -g automatic-rename on
set-option -g set-titles on
setw -g monitor-activity on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind ç split-window -v -c "#{pane_current_path}"
bind Ç split-window -h -c "#{pane_current_path}"
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key Enter new-window
bind-key bspace kill-pane

# List of plugins
set -g @tpm_plugins '\
tmux-plugins/tpm \
tmux-plugins/tmux-sensible \
christoomey/vim-tmux-navigator \
o0th/tmux-nova \
christoomey/vim-tmux-navigator \
tmux-plugins/tmux-yank
'

# ### THEME ###
set -g @plugin 'o0th/tmux-nova'
set -g @nova-nerdfonts false
# set -g @nova-nerdfonts-left 
# set -g @nova-nerdfonts-right 
# set -g @nova-nerdfonts-left ''
# set -g @nova-nerdfonts-right ''

set -g @nova-pane "#I #W"
set -g @nova-rows 0

### COLORS ###
b_bg="#504945"

seg_a="#a89984 #282828"
seg_b="$b_bg #ddc7a1"

inactive_bg="#32302f"
inactive_fg="#ddc7a1"
active_bg=$b_bg
active_fg="#ddc7a1"

set -gw window-status-current-style bold
set -g "@nova-status-style-bg" "$inactive_bg"
set -g "@nova-status-style-fg" "$inactive_fg"
set -g "@nova-status-style-active-bg" "$active_bg"
set -g "@nova-status-style-active-fg" "$active_fg"

set -g "@nova-pane-active-border-style" "#44475a"
set -g "@nova-pane-border-style" "#827d51"


set -g @nova-segment-mode "#{?client_prefix,P,S}"
set -g @nova-segment-mode-colors "#504945 #928374"

set -g @nova-segment-whoami "#(whoami)@#h"
set -g @nova-segment-whoami-colors "#504945 #928374"

set -g @nova-pane "#I#{?pane_in_mode,  #{pane_mode},}  #W"

set -g @nova-rows 0
set -g @nova-segments-0-left "mode"
set -g @nova-segments-0-right "whoami"

run '~/.tmux/plugins/tpm/tpm'
